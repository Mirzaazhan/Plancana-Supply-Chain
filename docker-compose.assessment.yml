# WIF3005 Alternative Assessment - Full Stack Docker Compose
# Repository: https://github.com/Mirzaazhan/Plancana-Supply-Chain
# This configuration runs WITHOUT the Hyperledger Fabric network
# The backend will operate in "database-only mode"

version: "3.8"

services:
  # 1. PostgreSQL Database with PostGIS
  postgres_db:
    image: postgis/postgis:14-3.2
    container_name: assessment-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=plancana_db
    ports:
      - "5433:5432"
    networks:
      - assessment-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend API (Database-only mode, no Fabric network)
  backend:
    build: ./application
    env_file: ./application/.env
    container_name: assessment-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres_db:5432/plancana_db
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=assessment-secret-key
      - FRONTEND_URL=http://localhost:3001
      - WALLET_PATH=/app/wallet
      - CONNECTION_PROFILE_PATH=/app/config/connection-profile.json
    volumes:
      - ./application/wallet:/app/wallet
      - ./application/config:/app/config
      - /home/mirza/fabric-samples/test-network/organizations:/app/organizations
      - /home/mirza/fabric-samples/test-network/organizations:/home/mirza/fabric-samples/test-network/organizations
    extra_hosts:
      - "peer0.org1.example.com:172.19.0.1"
      - "peer0.org2.example.com:172.19.0.1"
      - "orderer.example.com:172.19.0.1"
    ports:
      - "3000:3000"
    networks:
      - assessment-network
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # 3. Frontend (Next.js)
  frontend:
    build: ./frontend/plancana-nextjs
    container_name: assessment-frontend
    env_file: ./frontend/plancana-nextjs/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=/api
    ports:
      - "3001:3000"
    networks:
      - assessment-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    depends_on:
      - backend
    restart: unless-stopped

networks:
  assessment-network:
    driver: bridge

volumes:
  postgres-data:
